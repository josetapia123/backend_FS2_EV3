server.port=8081
spring.application.name=creativamente-backend

# Conexión MySQL local (en EC2 puedes sobreescribir estos valores con variables de entorno)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:creativamDb}?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}

# JPA / Hibernate: crea y actualiza tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT: clave secreta (mínimo 32 caracteres para HS256) y duración (24 horas)
jwt.secret=${JWT_SECRET:CreativaMenteClaveSecretaSuperSeguraEvaluacion3_2026!}
jwt.expiration-ms=86400000

# Swagger UI accesible en http://localhost:8081/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html